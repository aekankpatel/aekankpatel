<svg xmlns="http://www.w3.org/2000/svg" width="380" height="170" viewBox="0 0 380 170">
  <title>Most used languages</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#2c5364"/>
  </linearGradient></defs>
  <style>
    text { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="379" height="169" rx="12" fill="url(#bg)" stroke="#2c5364"/>
  <text x="25" y="35" fill="#38BDF8" font-size="17" font-weight="700">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="55" width="330" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="55" width="182.84" height="10" fill="#3572A5"/>
    <rect x="207.34" y="55" width="83.14" height="10" fill="#DA5B0B"/>
    <rect x="289.98" y="55" width="40.52" height="10" fill="#F1E05A"/>
    <rect x="330.00" y="55" width="25.50" height="10" fill="#3178C6"/>
  </g>
  <g class="fade" style="animation-delay:0.00s"><circle cx="30" cy="88" r="5" fill="#3572A5"/><text x="41" y="92" fill="#FFFFFF" font-size="13">Python <tspan fill="#94A3B8">55.3%</tspan></text></g>
  <g class="fade" style="animation-delay:0.15s"><circle cx="205" cy="88" r="5" fill="#DA5B0B"/><text x="216" y="92" fill="#FFFFFF" font-size="13">Jupyter Notebook <tspan fill="#94A3B8">25.0%</tspan></text></g>
  <g class="fade" style="animation-delay:0.30s"><circle cx="30" cy="114" r="5" fill="#F1E05A"/><text x="41" y="118" fill="#FFFFFF" font-size="13">JavaScript <tspan fill="#94A3B8">12.1%</tspan></text></g>
  <g class="fade" style="animation-delay:0.45s"><circle cx="205" cy="114" r="5" fill="#3178C6"/><text x="216" y="118" fill="#FFFFFF" font-size="13">TypeScript <tspan fill="#94A3B8">7.6%</tspan></text></g>
</svg>
